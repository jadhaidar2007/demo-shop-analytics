<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Slow Pour</title>
  <meta name="description" content="Demo shop used to practise GA4 + Google Tag Manager ecommerce tracking.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">

  <!-- ===================================================================

       =================================================================== -->

  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=

  })(window,document,'script','dataLayer','GTM-58JN5ND9');</script>

<body data-page="checkout">
  <!-- Google Tag Manager (noscript) - replace GTM-58JN5ND9 here too -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-58JN5ND9"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Slow <span>Pour</span></a>
      <nav>
        <a href="index.html">Shop</a>
        <a href="cart.html">Cart<span class="cart-count" id="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="wrap page">
    <h1>Checkout</h1>
    <div class="checkout-layout">
      <form id="checkout-form">
        <div class="field-row">
          <label class="field">Full name
            <input type="text" name="name" autocomplete="off" required>
          </label>
          <label class="field">Email
            <input type="email" name="email" autocomplete="off" required>
          </label>
        </div>
        <label class="field">Street address
          <input type="text" name="street" autocomplete="off" required>
        </label>
        <div class="field-row">
          <label class="field">City
            <input type="text" name="city" autocomplete="off" required>
          </label>
          <label class="field">Postcode
            <input type="text" name="postcode" autocomplete="off" required>
          </label>
        </div>
        <p class="note">Demo only: type anything. Nothing is sent or stored, and there's no card field on purpose.</p>
        <button class="btn" type="submit">Place order</button>
      </form>

      <aside class="summary-box">
        <h2>Order summary</h2>
        <ul class="summary" id="summary"></ul>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">Slow Pour is a fake shop built to practise GA4 + Google Tag Manager tracking. No real products, no real payments.</div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
