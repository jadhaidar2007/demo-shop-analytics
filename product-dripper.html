<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slow Pour</title>
  <meta name="description" content="Demo shop used to practise GA4 + Google Tag Manager ecommerce tracking.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">

<body data-page="product" data-product-id="SP-001">
  <!-- Google Tag Manager (noscript) - replace GTM-58JN5ND9 here too -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-58JN5ND9"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">Slow <span>Pour</span></a>
      <nav>
        <a href="index.html">Shop</a>
        <a href="cart.html">Cart<span class="cart-count" id="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a class="back" href="index.html">← All gear</a>
    <div class="product-layout">
      <img id="p-img" class="product-img" src="" alt="" width="400" height="400">
      <div>
        <p class="eyebrow" id="p-cat"></p>
        <h1 id="p-name"></h1>
        <p class="price big" id="p-price"></p>
        <p id="p-desc"></p>
        <ul class="specs" id="p-specs"></ul>
        <div class="buy-row">
          <label>Qty
            <input type="number" id="qty" min="1" max="9" value="1">
          </label>
          <button class="btn" id="add-btn" type="button">Add to cart</button>
        </div>
        <p class="added" id="added-msg" hidden>Added to your cart. <a href="cart.html">View cart →</a></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">Slow Pour is a fake shop built to practise GA4 + Google Tag Manager tracking. No real products, no real payments.</div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/tracking.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
